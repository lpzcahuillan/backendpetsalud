spring.application.name=backendpetsalud

# Configuracion de Base de Datos MySQL (Clinica PetSalud)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petsalud_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de Seguridad JWT (Clave secreta HMAC-SHA256 en Base64 >= 256 bits)
jwt.secret=${JWT_SECRET:UGV0U2FsdWRDbGluaWNhVmV0ZXJpbmFyaWFDaGlsZTIwMjZTZWN1cml0eVNlY3JldEtleTI1NkJpdHM=}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Monitoreo de intentos fallidos (fuerza bruta)
security.login.max-attempts=5
security.login.lock-time-minutes=15

# Carga inicial de usuarios de prueba por rol
petsalud.seed.enabled=true
